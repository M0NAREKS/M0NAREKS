<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="accent" x1="220" y1="120" x2="980" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(270 115) rotate(18) scale(310 180)">
      <stop stop-color="#58A6FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(930 250) rotate(-160) scale(320 190)">
      <stop stop-color="#8B5CF6" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }

      .scan {
        animation: scan 7s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-40px); opacity: 0; }
        12% { opacity: .35; }
        88% { opacity: .35; }
        100% { transform: translateY(430px); opacity: 0; }
      }

      .pulse1 { animation: pulse1 5s ease-in-out infinite; }
      .pulse2 { animation: pulse2 6s ease-in-out infinite 1s; }
      .pulse3 { animation: pulse3 7s ease-in-out infinite 2s; }
      @keyframes pulse1 { 0%,100%{opacity:.25} 50%{opacity:.8} }
      @keyframes pulse2 { 0%,100%{opacity:.18} 50%{opacity:.65} }
      @keyframes pulse3 { 0%,100%{opacity:.22} 50%{opacity:.75} }

      .floatA { animation: floatA 8s ease-in-out infinite; transform-origin:center; }
      .floatB { animation: floatB 10s ease-in-out infinite; transform-origin:center; }
      @keyframes floatA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-7px)} }
      @keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-7px,8px)} }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      .dash {
        stroke-dasharray: 9 12;
        animation: dash 14s linear infinite;
      }
      @keyframes dash { to { stroke-dashoffset: -210; } }

      @media (prefers-reduced-motion: reduce) {
        .scan,.pulse1,.pulse2,.pulse3,.floatA,.floatB,.cursor,.dash { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowB)"/>

  <!-- Animated scanline -->
  <g class="scan">
    <rect x="0" y="-10" width="1200" height="1.5" fill="#58A6FF" fill-opacity=".12"/>
    <rect x="0" y="-6" width="1200" height="10" fill="#58A6FF" fill-opacity=".015"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="url(#accent)" stroke-opacity=".28" stroke-width="2"/>

  <!-- Decorative circuit lines -->
  <g opacity=".42">
    <path class="dash" d="M70 86 H202 L242 126 H335" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="70" cy="86" r="4" fill="#58A6FF" class="pulse1"/>
    <circle cx="335" cy="126" r="4" fill="#58A6FF" class="pulse2"/>

    <path class="dash" d="M865 244 H965 L1010 199 H1130" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="865" cy="244" r="4" fill="#8B5CF6" class="pulse2"/>
    <circle cx="1130" cy="199" r="4" fill="#22D3EE" class="pulse3"/>
  </g>

  <!-- Left floating code card -->
  <g class="floatA">
    <rect x="78" y="224" width="220" height="82" rx="14" fill="#161B22" fill-opacity=".78" stroke="#30363D"/>
    <circle cx="101" cy="246" r="4" fill="#FF7B72"/>
    <circle cx="117" cy="246" r="4" fill="#D29922"/>
    <circle cx="133" cy="246" r="4" fill="#3FB950"/>
    <text x="101" y="272" class="mono" font-size="12" fill="#8B949E">&gt; build --target=product</text>
    <text x="101" y="292" class="mono" font-size="12" fill="#58A6FF">✓ web  ✓ mobile  ✓ api</text>
  </g>

  <!-- Right floating stack card -->
  <g class="floatB">
    <rect x="902" y="55" width="220" height="90" rx="14" fill="#161B22" fill-opacity=".78" stroke="#30363D"/>
    <text x="927" y="82" class="mono" font-size="11" fill="#8B949E">STACK</text>
    <text x="927" y="108" class="mono" font-size="13" fill="#F0F6FC">Python · FastAPI</text>
    <text x="927" y="129" class="mono" font-size="13" fill="#F0F6FC">React · Flutter</text>
  </g>

  <!-- Main hero -->
  <g>
    <text x="600" y="132" text-anchor="middle" class="sans" font-size="18" font-weight="600" letter-spacing="4" fill="#8B949E">
      FULL STACK DEVELOPER
    </text>

    <text x="600" y="195" text-anchor="middle" class="sans" font-size="56" font-weight="800" letter-spacing="1.2" fill="#F0F6FC">
      OĞUZHAN BODUR
    </text>

    <rect x="375" y="216" width="450" height="3" rx="2" fill="url(#accent)" filter="url(#softGlow)" opacity=".8"/>

    <text x="600" y="255" text-anchor="middle" class="mono" font-size="16" fill="#C9D1D9">
      Web Applications · Mobile Applications · Backend Systems
    </text>

    <text x="600" y="291" text-anchor="middle" class="mono" font-size="13" fill="#58A6FF">
      shipping useful software
      <tspan class="cursor">_</tspan>
    </text>
  </g>

  <!-- Small status chips -->
  <g>
    <rect x="431" y="317" width="108" height="25" rx="12.5" fill="#161B22" stroke="#30363D"/>
    <circle cx="449" cy="329.5" r="4" fill="#3FB950" class="pulse1"/>
    <text x="461" y="333.5" class="mono" font-size="10.5" fill="#C9D1D9">WEB</text>

    <rect x="548" y="317" width="108" height="25" rx="12.5" fill="#161B22" stroke="#30363D"/>
    <circle cx="566" cy="329.5" r="4" fill="#58A6FF" class="pulse2"/>
    <text x="578" y="333.5" class="mono" font-size="10.5" fill="#C9D1D9">MOBILE</text>

    <rect x="665" y="317" width="108" height="25" rx="12.5" fill="#161B22" stroke="#30363D"/>
    <circle cx="683" cy="329.5" r="4" fill="#8B5CF6" class="pulse3"/>
    <text x="695" y="333.5" class="mono" font-size="10.5" fill="#C9D1D9">BACKEND</text>
  </g>
</svg>
